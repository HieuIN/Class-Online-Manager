services:
  - type: web
    name: ctalk-api
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_HOST
        fromDatabase:
          name: ctalk-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: ctalk-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: ctalk-db
          property: user
      - key: DB_PASS
        fromDatabase:
          name: ctalk-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: ctalk-db
          property: database
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: CORS_ORIGIN
        value: https://ctalkchinese.com
      - key: FRONTEND_URL
        value: https://ctalkchinese.com
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
    disk:
      name: ctalk-uploads
      mountPath: /var/data
      sizeGB: 1

  - type: web
    name: ctalk
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://api.ctalkchinese.com/api
      - key: VITE_SOCKET_URL
        value: https://api.ctalkchinese.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: ctalk-db
    plan: basic-256mb
    databaseName: ctalk
    user: ctalk
